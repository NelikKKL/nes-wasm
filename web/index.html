<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NES</title>
  <style>
    :root {
      --bg: #17171a;
      --panel: #222226;
      --line: #38383f;
      --text: #ebe9e4;
      --muted: #8e8c88;
      --accent: #d1252e;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    main { width: min(100%, 768px); display: grid; gap: 12px; }

    .screen {
      background: #000;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px;
    }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 256 / 240;
      image-rendering: pixelated;
      background: #000;
    }

    .bar { display: flex; flex-wrap: wrap; gap: 8px; }
    button, .btn {
      font: inherit;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 10px 14px;
      cursor: pointer;
    }
    button:hover, .btn:hover { border-color: var(--muted); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:focus-visible, .btn:focus-within { outline: 2px solid var(--text); outline-offset: 2px; }
    #status { margin: 0; color: var(--muted); font-size: 14px; min-height: 1.4em; overflow-wrap: anywhere; }

    dialog {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      width: min(94vw, 560px);
    }
    dialog::backdrop { background: rgba(0, 0, 0, .65); }
    dialog h2 { margin: 0 0 4px; font-size: 20px; }
    dialog .hint { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .cols h3 { margin: 0 0 8px; font-size: 16px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 3px 0; }
    .key { min-width: 96px; text-align: center; padding: 6px 10px; background: var(--bg); }
    .key.listening { border-color: var(--accent); color: var(--accent); }
    .actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 20px; }
    @media (max-width: 480px) { .cols { grid-template-columns: 1fr; gap: 16px; } }
  </style>
</head>
<body>
  <main>
    <div class="screen"><canvas id="screen" width="256" height="240"></canvas></div>
    <div class="bar">
      <label class="btn primary">Открыть ROM<input id="rom" type="file" accept=".nes" hidden></label>
      <button id="pause" type="button">Пауза</button>
      <button id="reset" type="button">Сброс</button>
      <button id="binds" type="button">Управление</button>
    </div>
    <p id="status">Выбери .nes файл или перетащи его на страницу.</p>
  </main>

  <dialog id="dlg">
    <h2>Управление</h2>
    <p class="hint">Нажми на кнопку справа от действия, затем на нужную клавишу. Backspace убирает привязку, Esc отменяет.</p>
    <div class="cols" id="cols"></div>
    <div class="actions">
      <button id="defaults" type="button">Сбросить</button>
      <button id="close" type="button">Готово</button>
    </div>
  </dialog>

  <script type="module" src="main.js"></script>
</body>
</html>
