name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build wasm
        run: wasm-pack build --release --target web --out-dir pkg

      # Библиотека — ровно три файла. Демо-страница лежит рядом только для проверки.
      - name: Collect library files
        run: |
          mkdir -p dist
          cp pkg/nes_wasm.js pkg/nes_wasm_bg.wasm dist/
          cp js/audio-worklet.js dist/
          cp examples/index.html dist/

      - name: Upload library (3 files)
        uses: actions/upload-artifact@v4
        with:
          name: nes-wasm-lib
          path: |
            dist/nes_wasm.js
            dist/nes_wasm_bg.wasm
            dist/audio-worklet.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
