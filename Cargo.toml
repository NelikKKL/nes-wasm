[package]
name = "nes-wasm"
version = "0.1.0"
edition = "2021"
description = "NES emulator in Rust, compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# wasm-opt из wasm-pack иногда спотыкается о новые фичи rustc, размер нам не критичен
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
